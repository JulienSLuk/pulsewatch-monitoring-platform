<!DOCTYPE html>
<html>
<head>

<title>PulseWatch Dashboard</title>

<style>

body{
font-family: Arial;
background:#111;
color:white;
text-align:center;
}

table{
margin:auto;
border-collapse:collapse;
width:70%;
}

th,td{
padding:12px;
border-bottom:1px solid #444;
}

.up{
color:lime;
}

.down{
color:red;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<h1>PulseWatch Monitoring Dashboard</h1>

<table>

<thead>
<tr>
<th>Service</th>
<th>Status</th>
<th>Response Time</th>
</tr>
</thead>

<tbody id="services">

</tbody>

</table>

<h2 style="margin-top:40px;">Response Time History</h2>
<canvas id="historyChart" style="max-width:1100px; height:400px; margin: 20px auto;"></canvas>

<script>
let chart;

async function loadServices() {
  const response = await fetch('/services');
  const data = await response.json();

  const table = document.getElementById("services");
  table.innerHTML = "";

  data.forEach(service => {
    let statusClass = service.status === "UP" ? "up" : "down";

    let row = `
      <tr onclick="loadHistory(${service.id}, '${service.name}')">
        <td>${service.name}</td>
        <td class="${statusClass}">${service.status}</td>
        <td>${service.response_time ?? "Timeout"}</td>
      </tr>
    `;

    table.innerHTML += row;
  });

  if (data.length > 0) {
    loadHistory(data[0].id, data[0].name);
  }
}

async function loadHistory(serviceId, serviceName) {
  const response = await fetch(`/services/${serviceId}/history`);
  const history = await response.json();

  const labels = history.map(item => item.checked_at);
  const values = history.map(item => item.response_time ?? 0);

  const ctx = document.getElementById("historyChart").getContext("2d");

  if (chart) {
    chart.destroy();
  }

  chart = new Chart(ctx, {
    type: "line",
    data: {
        labels: labels,
        datasets: [{
        label: `${serviceName} Response Time (s)`,
        data: values,
        tension: 0.4,
        borderWidth: 2,
        pointRadius: 3
        }]
    },
    options: {
        responsive: true,
        plugins: {
        legend: {
            labels: { color: "white" }
        }
        },
        scales: {
        x: {
            ticks: { color: "white" },
            grid: { color: "rgba(255,255,255,0.05)" }
        },
        y: {
            ticks: { color: "white" },
            grid: { color: "rgba(255,255,255,0.05)" }
        }
        }
    }
    });
}

loadServices();
setInterval(loadServices, 5000);
</script>

</body>
</html>
